:root{color-scheme:light dark;
--bg:light-dark(#FBF8F5,#0B0A0C);--panel:light-dark(#FFFFFF,#151316);--panel2:light-dark(#F4EEE8,#1C191C);

--ok:light-dark(#15803D,#4ADE80);--part:light-dark(#B45309,#FBBF24);--gap:light-dark(#DC2626,#F2643F);
--grad:linear-gradient(90deg,#F2643F,#FB923C 45%,#FBBF24 80%,#FDE047)}

a{color:var(--a2)}
.band{padding:clamp(28px,4vw,64px) max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
header{background:#0B0A0C;color:#F5F1EC;position:relative;overflow:hidden}

.cta{background:#0B0A0C;color:#F5F1EC;border-radius:18px;margin-top:26px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;padding:clamp(22px,3vw,40px)}

.msg{font-size:15px;margin-top:12px;color:#FBBF24;min-height:1.5em}
details{margin-top:26px;border-top:1px solid var(--line);padding-top:16px}
summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}

footer{color:var(--muted);font-size:14px}
.mbar{display:none}
@media(max-width:900px){main .grid{grid-template-columns:minmax(0,1fr)}.readout{position:static}
 .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:5;background:#0F0D10;color:#F5F1EC;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;border-top:3px solid #FB923C;font-size:14px}
 .mbar b{font:600 18px "IBM Plex Sans",system-ui,sans-serif}
 body{padding-bottom:64px}}
@media(max-width:600px){.cta{grid-template-columns:minmax(0,1fr)}.kv b{font-size:19px}.tab{min-width:calc(50% - 3px)}}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:28px}

.langbtn{min-height:40px;border:1px solid #3a3438;background:transparent;color:#F5F1EC;border-radius:999px;padding:8px 16px;font:600 14px "IBM Plex Sans",system-ui,sans-serif;cursor:pointer}
.langbtn:hover{border-color:#FB923C}
</style>

{
// ---------- data: Puerto Rico ----------
// Wages: BLS OEWS, Puerto Rico (statewide), May 2025, mean hourly
const W={admin:15.67,mkt:21.86,owner:45.43};
const ALL=18.68; // all occupations, Puerto Rico
const G={fin:["Finanzas, seguros y servicios legales","Finance, insurance and legal"],hl:["Salud","Health care"],re:["Bienes raíces y propiedades","Real estate and property"],pro:["Servicios profesionales y técnicos","Professional and technical services"],tr:["Construcción y servicios al hogar","Construction and home services"],con:["Restaurantes, comercio y servicios personales","Restaurants, retail and personal services"],oth:["Otros","Other"]};

all:[["Ley de seguridad de bancos de información (Ley 111-2005)","Puerto Rico data breach law (Act 111-2005)"],["Todo negocio que guarde información personal de residentes de Puerto Rico debe avisar a las personas afectadas si hay una brecha, e informar al DACO en un plazo no prorrogable de 10 días. Las multas van de $500 a $5,000 por violación. Los datos cifrados quedan fuera del deber de notificar; pegar datos de clientes en una cuenta personal de IA no los protege.","Any business that keeps personal information about Puerto Rico residents must notify the people affected by a breach and report it to DACO (Consumer Affairs) within a non-extendable 10 days. Fines run from $500 to $5,000 per violation. Encrypted data is exempt from notice; pasting client data into a personal AI account doesn't protect it."],"https://bvirtualogp.pr.gov/ogp/Bvirtual/leyesreferencia/PDF/111-2005.pdf"],

// ---------- state ----------
const $=id=>document.getElementById(id);
const KEY="ares-ai-calc-pr";
let S={ind:"",size:"",city:"",desk:null,hours:{},data:null,a:{},lang:"es"};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.a)S=Object.assign(S,s)}catch(e){}
try{const q=new URLSearchParams(location.search).get("lang");const g=localStorage.getItem("ares-pr-lang");if(q==="en"||q==="es")S.lang=q;else if(g==="en"||g==="es")S.lang=g}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const L=()=>S.lang==="en"?1:0;
const t=k=>S_[k][L()];
const tr=x=>Array.isArray(x)?x[L()]:x;
const fill=(s,o)=>s.replace(/\{(\w+)\}/g,(m,k)=>o[k]??m);
const nf=n=>Math.round(n).toLocaleString("en-US");
const fmt=n=>"$"+nf(n);
const lc=s=>S.lang==="en"?s.toLowerCase():s.charAt(0).toLowerCase()+s.slice(1);

const ind=()=>IND.find(i=>i.id===S.ind);
const tasksFor=I=>(P[I?I.p:"oth"]).t.map(([k,h,o])=>Object.assign({k,per:h},T[k],o||{}));
const wageOf=(tk,I,head)=>head===1?(I?I.w:ALL):(tk.r==="pro"?(I?I.w:ALL):W[tk.r]);
const deskDefault=()=>{const I=ind();const head=+S.size||1;return Math.max(1,Math.round(head*(P[I?I.p:"oth"].desk)))};

// ---------- static text ----------
function paintStatic(){
 document.documentElement.lang=S.lang;
 document.title=t("title");
 const md=document.querySelector('meta[name="description"]');if(md)md.content=t("desc");
 document.querySelectorAll("[data-t]").forEach(el=>{const k=el.dataset.t;if(S_[k])el.textContent=t(k)});
 $("langBtn").textContent=t("other");$("langBtn").setAttribute("lang",S.lang==="es"?"en":"es");
 $("facts").innerHTML=t("facts").map(f=>`<span>${f}</span>`).join("");
 $("foot").innerHTML=t("foot");
 $("localBars").innerHTML=LOCAL.map(([k,n,l])=>`<div class="lb"><span>${tr(l)}</span><b>${nf(n)}</b><i style="--w:${(n/LOCAL[0][1]*100).toFixed(0)}%"></i></div>`).join("");
 $("ind").innerHTML=`<option value="">${t("indChoose")}</option>`+Object.entries(G).map(([g,gl])=>`<optgroup label="${tr(gl)}">${IND.filter(i=>i.g===g).map(i=>`<option value="${i.id}">${tr(i.l)}</option>`).join("")}</optgroup>`).join("");
 $("size").innerHTML=SIZES.map(([v,l])=>`<option value="${v}">${tr(l)}</option>`).join("");
 $("city").innerHTML=`<option value="">${t("cityChoose")}</option>`+TOWNS.map(([c])=>`<option value="${c}">${c}</option>`).join("")+`<option value="other">${t("cityOther")}</option>`;
 $("dataOpts").innerHTML=DATA.map(([k,l])=>`<label class="opt"><input type="checkbox" value="${k}"> <span>${tr(l)}</span></label>`).join("");
 $("qs").innerHTML=Q.map(([k,q,os])=>`<fieldset><legend>${tr(q)}</legend><div class="opts two">${os.map(([v,l])=>`<label class="opt"><input type="radio" name="${k}" value="${v}"> <span>${tr(l)}</span></label>`).join("")}</div></fieldset>`).join("");
 // restore values
 $("ind").value=S.ind;$("size").value=S.size;$("city").value=S.city;
 syncData();
 Object.entries(S.a).forEach(([k,v])=>{const r=document.querySelector(`input[name="${k}"][value="${v}"]`);if(r)r.checked=true});
 buildSliders(false);
}

function buildSliders(reset){
 const I=ind();const desk=S.desk||deskDefault();
 if(reset||!S.hours||!Object.keys(S.hours).length){S.hours={};tasksFor(I).forEach(x=>S.hours[x.k]=Math.round(x.per*desk))}
 $("deskN").value=desk;
 const max=Math.min(400,Math.max(20,desk*40));
 $("sliders").innerHTML=tasksFor(I).map(x=>{const v=S.hours[x.k]??0;return `<div class="slider"><div class="sh"><b>${tr(x.l)}</b><output id="o-${x.k}">${v}<small> ${t("hrswk")}</small></output></div><p>${tr(x.n)}</p><input type="range" min="0" max="${max}" step="1" value="${Math.min(v,max)}" data-k="${x.k}" aria-label="${tr(x.l)}"></div>`}).join("");
}
function syncData(){const d=S.data||(ind()?ind().data:[]);document.querySelectorAll("#dataOpts input").forEach(c=>c.checked=d.includes(c.value))}

function calc(){
 const I=ind();const head=+S.size||1;const desk=S.desk||deskDefault();
 let lo=0,hi=0,vlo=0,vhi=0;const rows=[];
 tasksFor(I).forEach(x=>{const h=S.hours[x.k]||0,w=wageOf(x,I,head);
  const l=h*x.lo*4.33,u=h*x.hi*4.33;lo+=l;hi+=u;vlo+=l*w;vhi+=u*w;rows.push({t:x,h,l,w})});
 const a=S.a;const pts={
  use:{none:8,personal:3,mixed:12,biz:25},paste:{unknown:0,yes:4,rule:25,na:15},policy:{none:0,verbal:10,written:25},
  mfa:{all:12.5,some:6,no:0,ns:0},plan:{yes:12.5,wip:6,no:0,ns:0},train:{no:0,self:10,some:18,all:25}};
 const g=k=>a[k]==null?null:pts[k][a[k]];
 const vals=[g("use"),(g("paste")==null||g("policy")==null)?null:(g("paste")+g("policy"))/2,(g("mfa")==null||g("plan")==null)?null:g("mfa")+g("plan"),g("train")];
 const score=vals.every(v=>v!=null)?Math.round(vals.reduce((s,v)=>s+v,0)):null;
 const data=S.data||(I?I.data:[]);
 const sens=data.some(d=>HIGH.includes(d))?"High":data.some(d=>["card","hr"].includes(d))?"Medium":"Low";
 return {I,head,desk,lo,hi,vlo,vhi,rows,vals,score,sens,data};
}
const tagOf=v=>v==null?["t-na",t("tag")[3]]:v>=18?["t-ok",t("tag")[0]]:v>=9?["t-part",t("tag")[1]]:["t-gap",t("tag")[2]];

function render(){
 const R=calc();const I=R.I;
 const done={1:!!(S.ind&&S.size),2:!!(S.ind&&S.size),3:!!S.ind,4:Q.every(([k])=>S.a[k])};
 document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("done",!!done[b.dataset.s]));
 $("roInd").textContent=I?tr(I.l):t("roInd0");
 const ready=!!(S.ind&&S.size);
 if(!ready){R.lo=R.hi=R.vlo=R.vhi=0}
 const H=Math.round(R.lo),Hh=Math.round(R.hi);
 $("roHours").innerHTML=ready?`${H}<small>${Hh>H?"–"+Hh:""} ${t("hrsmo")}</small>`:`–<small> ${t("hrsmo")}</small>`;
 $("roHoursSub").textContent=ready?t("roSub1"):t("roSub0");
 $("roMonth").textContent=fmt(R.vlo);$("roYear").textContent=fmt(R.vlo*12);
 const share=R.desk?R.lo/4.33/(R.desk*40)*100:0;
 $("roShare").textContent=ready&&H?fill(t("share"),{p:share.toFixed(1)}):"";
 $("roScore").textContent=R.score==null?"–":R.score+"/100";
 $("roBar").style.width=(R.score||0)+"%";
 $("roPillars").innerHTML=t("pill").map(([n,d],i)=>{const c=tagOf(R.vals[i]);return `<li><span>${n}<br><small style="color:#A79F98">${d}</small></span><span class="tag ${c[0]}">${c[1]}</span></li>`}).join("");
 $("roSens").innerHTML=I?`${t("sens")}: <b>${t("sensV")[R.sens]}</b>${R.sens==="High"?t("sensHi"):""}`:"";
 $("mbH").textContent=H;$("mbV").textContent=fmt(R.vlo*12);$("mbS").textContent=R.score==null?"–":R.score;
 $("indHint").innerHTML=I?(I.pr?fill(t("indHint"),{n:nf(I.pr)}):t("indHintO")):t("indHint0");
 const town=TOWNS.find(x=>x[0]===S.city);
 $("cityHint").innerHTML=town?fill(t("cityHint"),{c:town[0],n:nf(town[1])}):"";
 renderMethod(R);renderPlan(R);save();
}

function renderMethod(R){
 const I=R.I;const en=L()===1;
 const pro=I?`$${I.w.toFixed(2)}`:"";
 const rows=R.rows.map(r=>`<tr><td>${tr(r.t.l)}</td><td class="r">${Math.round(r.t.lo*100)}–${Math.round(r.t.hi*100)}%</td><td class="r">$${r.w.toFixed(2)}/hr</td></tr>`).join("");
 const lawNote=I&&I.id==="law"?(en?" BLS doesn't publish lawyer wages for Puerto Rico, so law firms use the management occupations rate ($45.43) as a stand-in.":" El BLS no publica salarios de abogados para Puerto Rico, así que para bufetes usamos la tarifa de ocupaciones gerenciales ($45.43) como aproximación."):"";
 $("method").innerHTML=en?
 `<p><b>Hours.</b> For each task: weekly team hours × the share AI can realistically take on (a low and high estimate) × 4.33 weeks. The shares are cautious Ares Technical estimates, from 10% to 45% depending on the task. They aren't the 50–75% many calculators assume. The low end is the main figure.</p>
 <p><b>Value.</b> Each hour is priced at the Puerto Rico mean wage for the people who usually do that task (BLS, May 2025): office and admin $15.67, marketing $21.86, owner and manager time $45.43, and your industry's professional rate${I?` (${pro} for ${lc(tr(I.l))})`:""}. If you work alone, every hour uses your industry rate. Wages don't include benefits or payroll taxes, so true cost is higher.${lawNote}</p>
 <p><b>Sanity check.</b> In a St. Louis Fed survey, workers who used generative AI saved about 5.4% of their work hours on average. If your estimate is far above that, it assumes a well set-up team using AI daily.</p>
 <p><b>Readiness.</b> Four areas worth 25 points each: Tools (are people on business accounts), Policy (written rules and client-data handling), Security (two-step login and a written data-protection plan), People (training). In each area, 18 or more points is Observed, 9–17 is Partial and under 9 is a Gap.</p>
 <table><thead><tr><th>Task</th><th>AI share (low–high)</th><th>Paid at</th></tr></thead><tbody>${rows}</tbody></table>
 <p><b>Sources:</b> business counts from the <a href="https://data.census.gov/table/CBP2023.CB2300CBP?g=040XX00US72" target="_blank" rel="noopener">US Census County Business Patterns 2023, Puerto Rico</a>. Wages from <a href="https://data.bls.gov/oes/#/area/7200000/2025" target="_blank" rel="noopener">BLS Occupational Employment and Wage Statistics, Puerto Rico, May 2025</a>. Time savings from the <a href="https://www.stlouisfed.org/on-the-economy/2025/feb/impact-generative-ai-work-productivity" target="_blank" rel="noopener">St. Louis Fed</a> and <a href="https://www.nber.org/papers/w31161" target="_blank" rel="noopener">NBER Working Paper 31161</a>. These are estimates, not promises.</p>`
 :
 `<p><b>Horas.</b> Para cada tarea: horas semanales del equipo × la parte que la IA puede asumir de forma realista (un estimado bajo y uno alto) × 4.33 semanas. Las proporciones son estimados conservadores de Ares Technical, entre 10% y 45% según la tarea, no el 50–75% que suponen muchas calculadoras. La cifra principal es la baja.</p>
 <p><b>Valor.</b> Cada hora se valora al salario promedio en Puerto Rico de quienes suelen hacer esa tarea (BLS, mayo de 2025): oficina y administración $15.67, mercadeo $21.86, tiempo del dueño o gerente $45.43, y la tarifa profesional de su industria${I?` (${pro} para ${lc(tr(I.l))})`:""}. Si trabaja solo, todas las horas usan la tarifa de su industria. Los salarios no incluyen beneficios ni aportaciones patronales, así que el costo real es mayor.${lawNote}</p>
 <p><b>Comparación.</b> En una encuesta del Banco de la Reserva Federal de St. Louis, los trabajadores que usaban IA generativa ahorraron en promedio cerca del 5.4% de sus horas de trabajo. Si su estimado está muy por encima, supone un equipo bien preparado que usa IA a diario.</p>
 <p><b>Preparación.</b> Cuatro áreas de 25 puntos cada una: Herramientas (¿usan cuentas de negocio?), Política (reglas escritas y manejo de datos de clientes), Seguridad (verificación en dos pasos y un plan escrito de protección de datos) y Personas (adiestramiento). En cada área, 18 puntos o más es Observado, de 9 a 17 es Parcial y menos de 9 es Brecha.</p>
 <table><thead><tr><th>Tarea</th><th>Parte para IA (baja–alta)</th><th>Valorada a</th></tr></thead><tbody>${rows}</tbody></table>
 <p><b>Fuentes:</b> conteo de negocios del <a href="https://data.census.gov/table/CBP2023.CB2300CBP?g=040XX00US72" target="_blank" rel="noopener">US Census, County Business Patterns 2023, Puerto Rico</a>. Salarios de <a href="https://data.bls.gov/oes/#/area/7200000/2025" target="_blank" rel="noopener">BLS, Occupational Employment and Wage Statistics, Puerto Rico, mayo de 2025</a>. Ahorro de tiempo según el <a href="https://www.stlouisfed.org/on-the-economy/2025/feb/impact-generative-ai-work-productivity" target="_blank" rel="noopener">St. Louis Fed</a> y el <a href="https://www.nber.org/papers/w31161" target="_blank" rel="noopener">NBER Working Paper 31161</a>. Son estimados, no promesas.</p>`;
}

function renderPlan(R){
 const I=R.I;
 if(!I){$("planTitle").textContent=t("planT0");$("planLede").textContent=t("planL0");$("recos").innerHTML=`<p class="hint">${t("pickInd")}</p>`;$("rules").innerHTML="";$("pkgs").innerHTML="";$("flags").innerHTML="";return}
 const town=S.city&&S.city!=="other"?", "+S.city:"";
 $("planTitle").textContent=fill(t("planT"),{i:lc(tr(I.l))+town});
 $("planLede").textContent=fill(t("planL"),{lo:Math.round(R.lo),hi:Math.round(R.hi),v:fmt(R.vlo*12),s:R.score!=null?fill(t("planS"),{s:R.score}):""});
 const top=R.rows.filter(r=>r.h>0).sort((x,y)=>y.l*y.w-x.l*x.w).slice(0,3);
 const safe=R.data.includes("health")?tr(SAFE.health):R.data.includes("legal")?tr(SAFE.legal):(R.data.includes("fin")||R.data.includes("id"))?tr(SAFE.fin):"";
 $("recos").innerHTML=top.length?top.map((r,i)=>`<div class="reco"><div class="n">${i+1}</div><div><b>${tr(REC[r.t.k][0])}</b><p>${tr(REC[r.t.k][1])}</p><em>${fill(t("recoMeta"),{h:Math.round(r.l),v:fmt(r.l*r.w)})}${safe&&i===0?" · "+safe:""}</em></div></div>`).join(""):`<p class="hint">${t("moveSl")}</p>`;
 const keys=["all"].concat(I.rules);
 if(R.data.includes("health")&&!keys.includes("hipaa")&&I.p==="health")keys.push("hipaa");
 if(R.data.includes("kids")&&!keys.includes("coppa"))keys.push("coppa");
 if(R.data.includes("fin")&&I.p==="fin"&&!keys.some(k=>k.startsWith("glba")))keys.push("glbaIns");
 $("rules").innerHTML=keys.map(k=>RULES[k]).map(([ti,d,u])=>`<li><b>${tr(ti)}</b>${tr(d)} <a href="${u}" target="_blank" rel="noopener">${t("src")}</a></li>`).join("");
 const a=S.a,f=[],FL=t("flags");
 if((a.use==="personal"||a.use==="mixed")&&(a.paste==="yes"||a.paste==="unknown")&&R.sens!=="Low")f.push(FL[0]);
 if(a.plan&&a.plan!=="yes"&&I.rules.includes("glba"))f.push(FL[1]);
 if(R.data.includes("health")&&(a.use==="personal"||a.use==="mixed"))f.push(FL[2]);
 if(a.mfa&&a.mfa!=="all")f.push(FL[3]);
 if(a.plan&&a.plan!=="yes"&&R.sens==="High")f.push(FL[4]);
 $("flags").innerHTML=f.map(x=>`<p class="flag">${x}</p>`).join("");
 const K=t("pk"),pk=[K.rev];
 if(a.policy!=="written"||a.paste==="yes"||a.paste==="unknown")pk.push([K.pol[0],fill(K.pol[1],{i:lc(tr(I.l))})]);
 if(a.use&&a.use!=="biz")pk.push(K.tool);
 if(a.train&&a.train!=="all")pk.push(K.train);
 if(["m365","gws","both"].includes(a.plat))pk.push(a.plat==="gws"?K.gem:a.plat==="m365"?K.cop:K.both);
 if(R.head>=6)pk.push(K.sup);
 $("pkgs").innerHTML=pk.slice(0,4).map(([ti,d])=>`<div class="pk"><b>${ti}</b><span>${d}</span></div>`).join("")+`<p class="hint">${K.vn}</p>`;
}

function summary(){
 const R=calc();const I=R.I;const en=L()===1;
 const pl=t("pill"),tg=x=>tagOf(x)[1];
 return [en?"AI readiness results (Puerto Rico): Ares Technical":"Resultados de preparación para IA (Puerto Rico): Ares Technical",
 `${en?"Industry":"Industria"}: ${I?tr(I.l):"n/a"} | ${en?"Team":"Equipo"}: ${$("size").selectedOptions[0]?.text||"n/a"} | ${S.city&&S.city!=="other"?S.city:""}`,
 `${en?"Hours AI could give back":"Horas que la IA podría devolver"}: ${Math.round(R.lo)}–${Math.round(R.hi)} ${en?"per month":"al mes"}`,
 `${en?"Value":"Valor"}: ${fmt(R.vlo)}/${en?"month":"mes"}, ${fmt(R.vlo*12)}/${en?"year (low estimate, Puerto Rico wages)":"año (estimado bajo, salarios de Puerto Rico)"}`,
 `${t("readiness")}: ${R.score==null?(en?"not finished":"sin terminar"):R.score+"/100"} | ${t("sens")}: ${t("sensV")[R.sens]}`,
 ...pl.map((p,i)=>`  ${p[0]}: ${tg(R.vals[i])}`),
 `${en?"Start with":"Comience con"}: ${[...document.querySelectorAll("#recos b")].map(b=>b.textContent).join("; ")}`,
 `${en?"Book a call":"Reserve una llamada"}: https://calendly.com/fernando-jorge-arestechnical/30min`].join("\n");
}

function go(n){
 document.querySelectorAll(".step").forEach(s=>s.classList.toggle("on",s.id==="s"+n));
 document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.s==n));
 const c=$("calcCard");if(c.getBoundingClientRect().top<0)c.scrollIntoView({behavior:"smooth"});
}

// events
$("langBtn").addEventListener("click",()=>{S.lang=S.lang==="es"?"en":"es";try{localStorage.setItem("ares-pr-lang",S.lang)}catch(e){}paintStatic();render()});
$("ind").addEventListener("change",e=>{S.ind=e.target.value;S.desk=null;S.data=null;buildSliders(true);syncData();render()});
$("size").addEventListener("change",e=>{S.size=e.target.value;S.desk=null;buildSliders(true);render()});
$("city").addEventListener("change",e=>{S.city=e.target.value;render()});
$("deskN").addEventListener("change",e=>{const v=Math.max(1,Math.min(200,parseInt(e.target.value)||1));S.desk=v;buildSliders(true);render()});
$("sliders").addEventListener("input",e=>{const k=e.target.dataset.k;if(!k)return;S.hours[k]=+e.target.value;$("o-"+k).innerHTML=`${e.target.value}<small> ${t("hrswk")}</small>`;render()});
$("dataOpts").addEventListener("change",()=>{S.data=[...document.querySelectorAll("#dataOpts input:checked")].map(c=>c.value);render()});
$("qs").addEventListener("change",e=>{if(e.target.name){S.a[e.target.name]=e.target.value;render()}});
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>go(b.dataset.s)));
document.querySelectorAll("[data-next]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.next)));
$("copyBtn").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(summary());$("leadMsg").textContent=t("copied")}catch(e){$("leadMsg").textContent=t("copyFail")}});
$("lead").addEventListener("submit",async e=>{
 e.preventDefault();
 const name=$("ln").value.trim(),email=$("le").value.trim();
 if(!name||!/^\S+@\S+\.\S+$/.test(email)){$("leadMsg").textContent=t("fBad");return}
 if($("gotcha").value)return;
 const R=calc();
 const body={_subject:"AI calculator results (Puerto Rico): Ares Technical",region:"Puerto Rico",language:S.lang,name,email,company:$("lc").value.trim(),industry:R.I?R.I.l[1]:"",team_size:$("size").value,city:S.city,
  hours_low:Math.round(R.lo),hours_high:Math.round(R.hi),value_year:Math.round(R.vlo*12),readiness:R.score,sensitivity:R.sens,answers:JSON.stringify(S.a),data:(R.data||[]).join(", "),summary:summary()};
 $("leadMsg").textContent=t("sending");
 try{const r=await fetch("https://formspree.io/f/xrpqlvkw",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(body)});
  if(!r.ok)throw 0;$("leadMsg").textContent=fill(t("fOk"),{n:name});e.target.reset()}
 catch(err){$("leadMsg").textContent=t("fErr")}
});
paintStatic();render();
}
</script>
</body>
</html>
